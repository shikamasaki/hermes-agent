name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="sync-upstream-main"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          BASE_SHA="$(git rev-parse origin/main)"
          git checkout -B "$SYNC_BRANCH" "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # If this exact upstream head is already in our history, there is
          # nothing to sync. This remains correct when fork/main has custom
          # commits that make its tree intentionally differ from upstream.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            {
              echo "has_changes=false"
              echo "has_conflict=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve fork commits. Conflicts fail visibly; main is never reset.
          if git merge --no-edit upstream/main -m "Merge upstream main"; then
            {
              echo "has_changes=true"
              echo "has_conflict=false"
            } >> "$GITHUB_OUTPUT"
          else
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "Upstream merge failed without MERGE_HEAD; not treating it as a conflict." >&2
              exit 1
            fi
            echo "Merge conflict detected; leaving main unchanged."
            {
              echo "has_changes=false"
              echo "has_conflict=true"
              echo "upstream_sha=$(git rev-parse upstream/main)"
              echo "conflict_files=$(git diff --name-only --diff-filter=U | paste -sd, -)"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || {
              echo "git merge --abort failed after confirmed conflict." >&2
              exit 1
            }
          fi

      - name: Create or update upstream sync recovery issue
        if: ${{ !cancelled() && steps.merge.outputs.has_conflict == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          FORK_MAIN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_TITLE="upstream-sync-conflict:$UPSTREAM_SHA"
          ISSUE_BODY="$(
            printf 'upstream_sha: %s\nfork_main_sha: %s\nconflict_files:\n--- begin conflict filenames ---\n%s\n--- end conflict filenames ---\nrun_url: %s\n' \
              "$UPSTREAM_SHA" "$FORK_MAIN_SHA" "$CONFLICT_FILES" "$RUN_URL"
          )"
          MATCHING_ISSUES="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" |
              jq -sc --arg title "$ISSUE_TITLE" '
                add
                | [ .[] | select(.pull_request == null and .title == $title) ]
                | sort_by(.number)
              '
          )"
          ISSUE_NUMBER="$(jq -r '.[0].number // empty' <<<"$MATCHING_ISSUES")"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER" \
              -f state=open \
              -f body="$ISSUE_BODY" >/dev/null
            jq -r --argjson canonical "$ISSUE_NUMBER" \
              '.[] | select(.number != $canonical and .state == "open") | .number' \
              <<<"$MATCHING_ISSUES" |
              while read -r DUPLICATE_NUMBER; do
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/$DUPLICATE_NUMBER" -f state=closed >/dev/null
                echo "Closed duplicate recovery issue #$DUPLICATE_NUMBER for $UPSTREAM_SHA."
              done
            echo "Reopened or updated canonical recovery issue #$ISSUE_NUMBER for $UPSTREAM_SHA."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
              -f title="$ISSUE_TITLE" \
              -f body="$ISSUE_BODY" \
              --jq '.number' >/dev/null
            echo "Created recovery issue for $UPSTREAM_SHA."
          fi

      - name: Notify Hermes Gateway to resolve conflict
        if: ${{ !cancelled() && steps.merge.outputs.has_conflict == 'true' }}
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.UPSTREAM_SYNC_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.UPSTREAM_SYNC_WEBHOOK_SECRET }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          FORK_MAIN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WEBHOOK_URL" && -n "$WEBHOOK_SECRET" ]] || exit 0
          PAYLOAD="$(
            jq -nc \
              --arg event upstream_sync_conflict \
              --arg upstream_sha "$UPSTREAM_SHA" \
              --arg fork_main_sha "$FORK_MAIN_SHA" \
              --arg conflict_files "$CONFLICT_FILES" \
              --arg run_url "$RUN_URL" \
              '{event_type:$event,event:$event,upstream_sha:$upstream_sha,fork_main_sha:$fork_main_sha,conflict_files:$conflict_files,run_url:$run_url}'
          )"
          TIMESTAMP="$(date +%s)"
          export PAYLOAD TIMESTAMP
          SIGNATURE="$(python3 - <<'PY'
          import hashlib
          import hmac
          import os

          body = os.environ["PAYLOAD"].encode()
          timestamp = os.environ["TIMESTAMP"].encode()
          secret = os.environ["WEBHOOK_SECRET"].encode()
          print(hmac.new(secret, timestamp + b"." + body, hashlib.sha256).hexdigest())
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: upstream_sync_conflict' \
            --header "X-Webhook-Timestamp: $TIMESTAMP" \
            --header "X-Webhook-Signature-V2: $SIGNATURE" \
            --data-binary "$PAYLOAD" \
            "$WEBHOOK_URL"
          echo "Hermes Gateway accepted the conflict event."

      - name: Fail closed after upstream sync conflict
        if: ${{ !cancelled() && steps.merge.outputs.has_conflict == 'true' }}
        shell: bash
        run: exit 1

      - name: Validate and merge sync PR
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          PR_TITLE: 'chore: sync with upstream main'
          PR_BODY: 'Automated PR to sync this fork with `NousResearch/hermes-agent:main`. Conflicts fail the workflow and never modify the default branch.'
        shell: bash
        run: |
          set -euo pipefail
          git push origin sync-upstream-main --force-with-lease
          SYNC_SHA="$(git rev-parse HEAD)"

          PR_NUMBER="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:sync-upstream-main" \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
                -f title="$PR_TITLE" \
                -f body="$PR_BODY" \
                -f base=main \
                -f head=sync-upstream-main \
                --jq '.number'
            )"
            echo "Created PR #$PR_NUMBER."
          else
            echo "Updated existing PR #$PR_NUMBER."
          fi

          # PRs created with GITHUB_TOKEN do not recursively trigger the
          # pull_request workflow. Dispatch CI explicitly and correlate the
          # run with both an unguessable-per-run token and the exact head SHA.
          SYNC_TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SYNC_SHA:0:12}"
          gh workflow run ci.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref sync-upstream-main \
            -f sync_token="$SYNC_TOKEN"

          RUN_ID=""
          for _ in {1..30}; do
            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yaml \
                --branch sync-upstream-main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle,headSha |
              jq -r \
                --arg sha "$SYNC_SHA" \
                --arg title "CI upstream-sync $SYNC_TOKEN" \
                '[.[] | select(.headSha == $sha and .displayTitle == $title) | .databaseId][0] // empty'
            )"
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Could not locate dispatched CI for exact SHA $SYNC_SHA."
            exit 1
          fi

          # Hosted runners occasionally expose a known timing flake under full
          # suite pressure. Retry failed jobs once; a deterministic failure
          # fails again and still blocks the merge.
          if ! gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "CI failed; rerunning failed jobs once before failing closed."
            previous_attempt="$(
              gh run view "$RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --json attempt \
                --jq '.attempt'
            )"
            gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed

            # The rerun API is asynchronous. Wait until GitHub exposes a new
            # attempt so watch cannot observe the completed first attempt and
            # return its stale failure immediately.
            rerun_started=false
            for _ in {1..30}; do
              current_attempt="$(
                gh run view "$RUN_ID" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json attempt \
                  --jq '.attempt'
              )"
              if (( current_attempt > previous_attempt )); then
                rerun_started=true
                break
              fi
              sleep 2
            done
            [[ "$rerun_started" == true ]] || {
              echo "GitHub did not expose the requested CI rerun in time."
              exit 1
            }
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          fi

          # Fail closed if the branch or PR moved while CI was running.
          remote_head="$(git ls-remote --heads origin refs/heads/sync-upstream-main | cut -f1)"
          [[ "$remote_head" == "$SYNC_SHA" ]] || {
            echo "Sync branch moved after CI: expected $SYNC_SHA, got $remote_head"
            exit 1
          }
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER")"
          jq -e \
            --arg sha "$SYNC_SHA" \
            --arg base_sha "$BASE_SHA" \
            '.state == "open" and .base.ref == "main" and .base.sha == $base_sha and .head.ref == "sync-upstream-main" and .head.sha == $sha' \
            <<<"$PR_JSON" >/dev/null

          # GitHub's pull-request merge endpoint accepts an expected head SHA,
          # but no expected base SHA. Recheck the remote base immediately before
          # the request so a main advance fails closed instead of merging a sync
          # branch that CI tested against an older base.
          git fetch origin refs/heads/main:refs/remotes/origin/main
          CURRENT_BASE_SHA="$(git rev-parse origin/main)"
          [[ "$CURRENT_BASE_SHA" == "$BASE_SHA" ]] || {
            echo "Main advanced after CI: expected $BASE_SHA, got $CURRENT_BASE_SHA"
            exit 1
          }

          # Use a real merge commit. Squashing would discard upstream ancestry
          # and make the same upstream commits appear unsynced on the next day.
          MERGE_JSON="$(
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER/merge" \
              -f merge_method=merge \
              -f sha="$SYNC_SHA" \
              -f commit_title="$PR_TITLE"
          )"
          jq -e '.merged == true' <<<"$MERGE_JSON" >/dev/null

          git fetch origin main
          git merge-base --is-ancestor "$SYNC_SHA" origin/main

      - name: Close resolved upstream sync recovery issues
        if: steps.merge.outputs.has_conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" |
            jq -rs -r '
              .[].[]
              | select(.pull_request == null)
              | . as $issue
              | try (.title | capture("^upstream-sync-conflict:(?<sha>[0-9a-f]{40})$").sha) catch empty
              | "\($issue.number) \(.)"
            ' |
            while read -r ISSUE_NUMBER TRACKED_SHA; do
              if git merge-base --is-ancestor "$TRACKED_SHA" origin/main; then
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER" -f state=closed >/dev/null
                echo "Closed resolved recovery issue #$ISSUE_NUMBER for $TRACKED_SHA."
              fi
            done
